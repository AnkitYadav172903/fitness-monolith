spring.application.name=fitness-monolith

# Database configuration (set via environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:${DB_USER:root}}
spring.datasource.password=${DB_PASSWORD:${DB_PWD:}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN

# JWT
jwt.secret=${JWT_SECRET:YS1zdHJpbmctc2VjcmV0LWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmc=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:172800000}

# CORS (comma separated list of origins, * = all)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# SpringDoc / Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

server.port=${PORT:8080}