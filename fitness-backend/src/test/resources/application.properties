spring.application.name=fitness-monolith

# Test configuration - use H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=INFO

# JWT (test)
jwt.secret=YS1zdHJpbmctc2VjcmV0LWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmc=
jwt.expiration-ms=172800000

# Avatar storage (isolated test dir, must be defined since UserController requires it)
avatar.storage.dir=${AVATAR_STORAGE_DIR:./target/test-uploads/avatars}

# CORS (test default, mirrors main config shape)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
