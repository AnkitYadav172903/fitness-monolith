spring.application.name=fitness-monolith

# Database configuration (set via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-dry-morning-ae7krt65-pooler.c-2.us-east-2.aws.neon.tech/fitness}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_W5LNVnQvDc8O}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN

# JWT (JWT_SECRET is REQUIRED - the app fails fast at startup without it)
jwt.secret=ThisisASecretKeyForJWTSigningAndVerification1234567890
jwt.expiration-ms=${JWT_EXPIRATION_MS:172800000}

# CORS (comma separated list of origins, * = all)
# Defaults to the deployed frontend and local dev; override with APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://fitness-monolith.vercel.app,http://localhost:5173}

# Multipart uploads (avatar capped at 2 MB to match UserController)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Avatar file storage (outside the packaged jar, persists across restarts)
# Files live under uploads/avatars/<userId>.<ext> and are served at /avatars/<userId>.<ext>
avatar.storage.dir=${AVATAR_STORAGE_DIR:./uploads/avatars}
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# SpringDoc / Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

server.port=${PORT:8080}