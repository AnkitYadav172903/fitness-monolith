<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Fitness Monolith</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #020617;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
    }
    .card {
        max-width: 340px;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 20px;
        padding: 40px 32px;
    }
    .icon {
        font-size: 56px;
        margin-bottom: 16px;
    }
    h1 { font-size: 24px; margin-bottom: 10px; }
    p { color: #94a3b8; line-height: 1.6; font-size: 14px; }
    button {
        background: #2563EB;
        color: #ffffff;
        padding: 14px 28px;
        border: none;
        border-radius: 12px;
        margin-top: 24px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
    }
    button:hover { background: #1d4ed8; }
</style>
</head>
<body>
    <div class="card">
        <div class="icon">⚡</div>
        <h1>You're Offline</h1>
        <p>Internet connection unavailable. Your cached activity data is still safe.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
